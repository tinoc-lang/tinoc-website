<style>

  .status-dot{

<script>
// Ambient hero art: two slow-drifting light sources (soft mint glow on pine)
// plus a faint field of monospace glyphs that quietly fade in and out —
// reads as "compiled output happening somewhere in the dark," not a generic effect.
(function(){
  const canvas = document.getElementById('hero-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GLYPHS = '01{}[]<>;=+-*/_'.split('');

  let W, H, DPR, glyphs, orbs;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function build(){
    const isMobile = W < 640;

    orbs = [
      { x: W*0.28, y: H*0.35, r: Math.max(W,H)*0.28, hue: 'rgba(94,234,212,', speed: 0.00012, amp: 60, phase: 0 },
      { x: W*0.74, y: H*0.62, r: Math.max(W,H)*0.22, hue: 'rgba(167,243,224,', speed: 0.00009, amp: 80, phase: 2.1 },
    ];

    const count = isMobile ? 26 : 54;
    glyphs = Array.from({length: count}, () => ({
      x: Math.random()*W,
      y: Math.random()*H,
      ch: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
      size: 11 + Math.random()*7,
      baseAlpha: 0.04 + Math.random()*0.07,
      phase: Math.random()*Math.PI*2,
      speed: 0.0006 + Math.random()*0.0008,
      drift: (Math.random()-.5)*0.05,
    }));
  }

  function step(t){
    ctx.clearRect(0,0,W,H);

    // soft drifting glow orbs
    for(const o of orbs){
      const ox = o.x + Math.cos(t*o.speed + o.phase) * o.amp;
      const oy = o.y + Math.sin(t*o.speed*1.3 + o.phase) * o.amp;
      const grad = ctx.createRadialGradient(ox, oy, 0, ox, oy, o.r);
      grad.addColorStop(0, o.hue + '0.10)');
      grad.addColorStop(1, o.hue + '0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    // faint monospace glyph field, gently breathing
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    for(const g of glyphs){
      const alpha = reduceMotion ? g.baseAlpha : g.baseAlpha * (0.5 + 0.5*Math.sin(t*g.speed + g.phase));
      ctx.font = `${g.size}px "Geist Mono", monospace`;
      ctx.fillStyle = `rgba(94,234,212,${alpha.toFixed(3)})`;
      ctx.fillText(g.ch, g.x, g.y);
      if(!reduceMotion){
        g.y += g.drift;
        if(g.y < -20) g.y = H+20;
        if(g.y > H+20) g.y = -20;
      }
    }

    if(!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('resize', resize, { passive:true });
  resize();
  requestAnimationFrame(step);
  if(reduceMotion) step(0);
})();
</script>
